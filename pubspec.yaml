name: carrom_master
description: "Carrom Zone — Modern Minimal Dark Tabletop Carrom Game."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  shared_preferences: ^2.5.6
  audioplayers: ^6.8.1
  google_fonts: ^8.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/audio/
    - assets/images/backgrounds/
    - assets/images/logo/
    - assets/images/themes/
    - assets/images/strikers/
    - assets/images/pieces/mahogany/
    - assets/images/pieces/emerald/
    - assets/images/pieces/midnight/
    - assets/images/pieces/walnut_club/
    - assets/images/pieces/royal_indigo/
    - assets/images/pieces/emerald_lounge/
    - assets/images/pieces/ocean_breeze/
    - assets/images/pieces/sakura_studio/
    - assets/images/pieces/neon_arena/
    - assets/images/pieces/golden_palace/
    - assets/images/pieces/cosmic_elite/
